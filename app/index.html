<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pops – Download</title>
    <meta name="description" content="Pops: learn German and English with pictures. Download on the App Store." />
    <meta name="apple-itunes-app" content="app-id=6819862034" />
    <meta property="og:title" content="Pops: English & German" />
    <meta property="og:description" content="Learn German and English with pictures." />
    <meta property="og:image" content="https://cleevao.github.io/pops-support/assets/Icon.png" />
    <meta property="og:url" content="https://cleevao.github.io/pops-support/app/" />
    <meta name="theme-color" content="#934a5b" />
    <link rel="icon" href="../assets/Icon.png" />
    <link rel="apple-touch-icon" href="../assets/Icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --rose: #b0647a;
        --rose-deep: #7c384b;
        --ink: #2a1a20;
        --white: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--white);
        background: linear-gradient(160deg, var(--rose) 0%, var(--rose-deep) 100%);
        background-color: var(--rose-deep);
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
        text-align: center;
        overflow-x: hidden;
      }
      .bubble { position: fixed; border-radius: 50%; background: rgba(255,255,255,.10); pointer-events: none; }
      .b1 { width: 180px; height: 180px; top: -60px; left: -50px; }
      .b2 { width: 110px; height: 110px; bottom: 12%; right: -30px; }
      .b3 { width: 60px; height: 60px; top: 22%; right: 14%; }
      main { position: relative; width: 100%; max-width: 380px; }
      .icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 32px rgba(0,0,0,.25); }
      h1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 48px; line-height: 1; margin: 22px 0 10px; }
      .tagline { font-size: 18px; opacity: .95; margin-bottom: 32px; }
      .store { display: inline-block; border-radius: 14px; transition: transform .15s; -webkit-tap-highlight-color: transparent; }
      .store:active { transform: scale(.96); }
      .store img { display: block; height: 64px; width: auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,.22)); }
      .alt { display: inline-block; margin-top: 16px; color: var(--white); opacity: .85; font-size: 15px; }
      .note {
        margin-top: 28px; padding: 16px 18px; border-radius: 18px;
        background: rgba(255,255,255,.16); font-size: 15px; line-height: 1.45;
      }
      .note strong { font-weight: 700; }
      .note.flash { animation: flash .6s ease 2; }
      @keyframes flash { 50% { background: rgba(255,255,255,.34); } }
      .hidden { display: none; }
      /* Arrow to Instagram's ⋯ menu, top right */
      .pointer {
        position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 14px;
        font-size: 34px; line-height: 1; animation: nudge 1.2s ease-in-out infinite;
      }
      @keyframes nudge { 50% { transform: translate(4px, -6px); } }
      @media (prefers-reduced-motion: reduce) { .pointer, .note.flash { animation: none; } }
    </style>
  </head>
  <body>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="pointer hidden" id="pointer" aria-hidden="true">↗</div>

    <main>
      <img class="icon" src="../assets/Icon.png" alt="Pops" width="112" height="112" />
      <h1>Pops!</h1>
      <p class="tagline" id="tagline">Learn German and English with pictures</p>

      <a class="store" id="store" href="https://apps.apple.com/app/id6819862034">
        <img id="badge" src="../assets/badges/app-store-en-us.svg" alt="Download on the App Store" height="64" />
      </a>
      <br /><a class="alt hidden" id="alt" href="https://apps.apple.com/app/id6819862034">Open the App Store page</a>

      <p class="note hidden" id="inApp"></p>
      <p class="note hidden" id="android"></p>
    </main>

    <script>
      (function () {
        var APP_ID = "6819862034";
        // App Store Connect campaign link: set PT (provider token, App Store Connect →
        // Analytics → Acquisition → Campaigns) to see visits and downloads per campaign there.
        var PT = "";
        var params = new URLSearchParams(location.search);
        var SRC = (params.get("src") || "instagram").replace(/[^a-z0-9_-]/gi, "").slice(0, 40) || "instagram";
        var CAMPAIGN = PT ? "?pt=" + PT + "&ct=" + SRC + "&mt=8" : "";
        var HTTPS = "https://apps.apple.com/app/id" + APP_ID + CAMPAIGN;
        var NATIVE = "itms-apps://apps.apple.com/app/id" + APP_ID + CAMPAIGN;

        // Counting: PostHog's public project key (write-only, made to be public).
        // No cookies, no storage: a random id per page load, no person profiles.
        var PH_KEY = "phc_xmx64T6gJRhp4B3bFgfhVQsqgB6bBWZyZnf2jtSmJ4QK";
        var PH_URL = "https://us.i.posthog.com/i/v0/e/";
        var visitId = "landing-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        var base = {};
        function track(event, extra) {
          var props = { $process_person_profile: false, $lib: "pops-landing", $current_url: location.href, $referrer: document.referrer || "$direct" };
          for (var k in base) props[k] = base[k];
          for (var k2 in extra || {}) props[k2] = extra[k2];
          var body = JSON.stringify({ api_key: PH_KEY, event: event, distinct_id: visitId, properties: props });
          try {
            fetch(PH_URL, { method: "POST", body: body, keepalive: true, headers: { "Content-Type": "text/plain" } }).catch(function () {});
          } catch (e) {}
        }

        var T = {
          en: {
            badge: "en-us",
            tagline: "Learn German and English with pictures",
            store: "Download on the App Store",
            alt: "Open the App Store page",
            inApp: "Instagram can't open the App Store. Tap <strong>⋯</strong> at the top right, choose <strong>Open in external browser</strong>, then tap the button.",
            android: "Pops is <strong>iPhone only</strong> for now."
          },
          tr: {
            badge: "tr-tr",
            tagline: "Resimlerle Almanca ve İngilizce öğren",
            store: "App Store'dan indir",
            alt: "App Store sayfasını aç",
            inApp: "Instagram App Store'u açamıyor. Sağ üstteki <strong>⋯</strong> simgesine dokun, <strong>Harici tarayıcıda aç</strong>'ı seç, sonra butona bas.",
            android: "Pops şimdilik <strong>sadece iPhone</strong>'da."
          },
          de: {
            badge: "de-de",
            tagline: "Deutsch und Englisch lernen mit Bildern",
            store: "Im App Store laden",
            alt: "App-Store-Seite öffnen",
            inApp: "Instagram kann den App Store nicht öffnen. Tippe oben rechts auf <strong>⋯</strong>, wähle <strong>Im externen Browser öffnen</strong> und tippe dann auf den Button.",
            android: "Pops gibt es vorerst <strong>nur fürs iPhone</strong>."
          }
        };

        var langs = (navigator.languages || [navigator.language || "en"]).map(function (l) { return String(l).slice(0, 2).toLowerCase(); });
        var lang = "en";
        for (var i = 0; i < langs.length; i++) { if (T[langs[i]]) { lang = langs[i]; break; } }
        var t = T[lang];
        document.documentElement.lang = lang;

        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);
        var inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|musical_ly|BytedanceWebview|TikTok|Snapchat|LinkedInApp|Line\//i.test(ua);

        var $ = function (id) { return document.getElementById(id); };
        $("tagline").textContent = t.tagline;
        $("badge").src = "../assets/badges/app-store-" + t.badge + ".svg";
        $("badge").alt = t.store;
        $("alt").textContent = t.alt;
        $("inApp").innerHTML = t.inApp;
        $("android").innerHTML = t.android;

        var store = $("store");
        store.href = HTTPS;
        $("alt").href = HTTPS;

        var inAppName = /Instagram/i.test(ua) ? "instagram" : /FBAN|FBAV|FB_IAB|FBIOS/i.test(ua) ? "facebook"
          : /musical_ly|BytedanceWebview|TikTok/i.test(ua) ? "tiktok" : inApp ? "other" : "none";
        base = {
          src: SRC,
          device_language: navigator.language || "",
          device_languages: (navigator.languages || []).join(","),
          page_language: lang,
          platform: isIOS ? "ios" : isAndroid ? "android" : "desktop",
          in_app_browser: inAppName,
          screen_width: window.screen && screen.width
        };
        track("landing_view");
        store.addEventListener("click", function () { track("landing_store_tap", { button: "badge" }); });
        $("alt").addEventListener("click", function () { track("landing_store_tap", { button: "link" }); });

        if (isAndroid) {
          $("android").classList.remove("hidden");
          store.classList.add("hidden");
          return;
        }

        if (!isIOS) return; // desktop: plain https link

        // iPhone: the App Store app's own scheme gets past in-app browsers more often than https.
        store.href = NATIVE;
        $("alt").classList.remove("hidden");

        // In an in-app browser (Instagram, Facebook, …) App Store links open the app's own
        // store sheet, which fails ("Cannot Connect to iTunes Store"). So the badge hands the
        // App Store page to Safari instead (x-safari-https, iOS 17+). Instagram blocks
        // that too (2026-11-23), so the note (⋯ → open in external browser) shows from the start.
        if (inApp) {
          store.href = "x-safari-" + HTTPS;
          $("alt").classList.add("hidden");
          $("inApp").classList.remove("hidden");
          $("pointer").classList.remove("hidden");
        }

        store.addEventListener("click", function () {
          var method = inApp ? "x-safari" : "itms-apps";
          var left = false;
          var onHide = function () {
            if (!document.hidden || left) return;
            left = true;
            track("landing_store_opened", { method: method });
          };
          document.addEventListener("visibilitychange", onHide);
          window.addEventListener("pagehide", onHide);
          setTimeout(function () {
            document.removeEventListener("visibilitychange", onHide);
            window.removeEventListener("pagehide", onHide);
            if (left) return;
            track("landing_store_failed", { method: method });
            var note = $("inApp");
            note.classList.remove("hidden", "flash");
            void note.offsetWidth;
            note.classList.add("flash");
            $("pointer").classList.remove("hidden");
          }, 1500);
        });
      })();
    </script>
  </body>
